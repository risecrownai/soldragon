# Cloudflare Pages 설정 (사이트는 public/, 서버 코드는 functions/, DB는 D1)
name = "soldragon"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "soldragon"
# `npx wrangler d1 create soldragon` 결과로 나온 database_id로 바꾸세요.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# 구글 클라우드 콘솔에서 만든 OAuth 클라이언트 ID (공개 값이라 코드에 둬도 됩니다)
GOOGLE_CLIENT_ID = ""
# 쉼표로 구분한 관리자 이메일. 이 계정은 모든 댓글을 삭제할 수 있습니다. (선택)
ADMIN_EMAILS = ""
