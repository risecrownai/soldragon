# 터미널(wrangler)로 배포·로컬 실행할 때만 쓰는 예시입니다. 사용하려면 이 파일을 wrangler.toml 로 복사하세요.
# 웹 대시보드(Git 연결)로 배포할 때는 이 파일이 필요 없고, 오히려 wrangler.toml 이 있으면
# 대시보드에서 바인딩·변수를 고칠 수 없게 되므로 저장소 루트에 wrangler.toml 을 두지 마세요.
name = "soldragon"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "soldragon"
# `npx wrangler d1 create soldragon` 결과로 나온 database_id로 바꾸세요.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# 쉼표로 구분한 관리자 지갑 주소. 이 지갑은 모든 댓글을 삭제할 수 있습니다. (선택)
ADMIN_WALLETS = ""
