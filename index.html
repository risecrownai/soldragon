<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연꽃 · 용 · 태양 불경</title>
<meta name="description" content="">
<link rel="icon" href="images/lotus.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="icon-btn" data-i18n-aria="menuOpen">☰</button>
  <img src="images/sun.svg" alt="" class="logo">
  <h1><span data-i18n="brand"></span> <small>Sutra Reader</small></h1>
  <div class="wallet">
    <select id="uiLang" data-i18n-aria="uiLang">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
    <select id="network" data-i18n-aria="network">
      <option value="mainnet-beta">Mainnet</option>
      <option value="devnet">Devnet</option>
    </select>
    <span id="walletInfo" class="wallet-info" hidden></span>
    <button id="walletBtn" class="btn primary" data-i18n="walletConnect"></button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <h2 data-i18n="sutraList"></h2>
      <button id="addBtn" class="btn small" data-i18n="addSutra"></button>
    </div>
    <div class="side-tools">
      <button id="reorderBtn" class="btn small ghost" data-i18n="reorder"></button>
      <button id="resetOrderBtn" class="btn small ghost" data-i18n="reorderReset" hidden></button>
    </div>
    <ul id="sutraList"></ul>
    <div class="side-foot">
      <button id="exportBtn" class="btn small ghost" data-i18n="export"></button>
      <label class="btn small ghost"><span data-i18n="import"></span><input id="importFile" type="file" accept="application/json" hidden></label>
    </div>
    <div class="deco">
      <img src="images/lotus.svg" data-i18n-alt="altLotus" alt="">
      <img src="images/dragon.svg" data-i18n-alt="altDragon" alt="">
    </div>
  </aside>

  <main id="main">
    <section class="hero">
      <img src="images/dragon.svg" data-i18n-alt="altDragon" alt="" class="hero-dragon">
      <img src="images/sun.svg" data-i18n-alt="altSun" alt="" class="hero-sun">
      <img src="images/lotus.svg" data-i18n-alt="altLotus" alt="" class="hero-lotus">
    </section>

    <section id="reader" hidden>
      <h2 id="title"></h2>
      <div class="controls">
        <button id="playBtn" class="btn primary" data-i18n="play"></button>
        <button id="pauseBtn" class="btn" data-i18n="pause" disabled></button>
        <button id="stopBtn" class="btn" data-i18n="stop"></button>
        <label><span data-i18n="read"></span>
          <select id="mode" data-i18n-title="modeHint">
            <option value="all" data-i18n="modeAll"></option>
            <option value="orig" data-i18n="modeOrig"></option>
            <option value="en" data-i18n="modeEn"></option>
            <option value="ko" data-i18n="modeKo"></option>
          </select>
        </label>
        <label><span data-i18n="repeat"></span>
          <select id="repeat">
            <option value="1">1</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="10">10</option>
            <option value="21">21</option>
            <option value="108">108</option>
            <option value="0" data-i18n="repeatInf"></option>
          </select>
          <select id="scope" data-i18n-aria="repeatScope">
            <option value="all" data-i18n="scopeAll"></option>
            <option value="para" data-i18n="scopePara"></option>
          </select>
          <output id="repeatInfo"></output>
        </label>
        <label><span data-i18n="voice"></span>
          <select id="voice" data-i18n-title="voiceHint">
            <option value="auto" data-i18n="voiceAuto"></option>
            <option value="f" data-i18n="voiceFemale"></option>
            <option value="m" data-i18n="voiceMale"></option>
          </select>
        </label>
        <label><span data-i18n="voiceName"></span>
          <select id="voiceName" class="voice-name"></select>
        </label>
        <label><span data-i18n="pitch"></span>
          <input id="pitch" type="range" min="0.6" max="1.4" step="0.05" value="1" data-i18n-aria="pitch">
          <output id="pitchOut">1.00</output>
        </label>
        <label><span data-i18n="volume"></span>
          <input id="volume" type="range" min="0" max="1" step="0.1" value="1" data-i18n-aria="volume">
          <output id="volumeOut">100%</output>
        </label>
        <label><span data-i18n="speed"></span>
          <input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.9" data-i18n-aria="speed">
        </label>
        <label class="check"><input id="auto" type="checkbox" checked> <span data-i18n="auto"></span></label>
      </div>
      <p id="ttsNote" class="note" hidden></p>
      <p id="intro" class="note intro" hidden></p>
      <div id="paras"></div>
    </section>
    <p id="empty" class="note" data-i18n="selectPrompt"></p>
  </main>
</div>

<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h2 data-i18n="addTitle"></h2>
    <label><span data-i18n="fTitle"></span> <input name="title" required maxlength="100"></label>
    <label><span data-i18n="fLang"></span>
      <select name="lang">
        <option value="zh-CN" data-i18n="langZh"></option>
        <option value="hi-IN" data-i18n="langPali"></option>
        <option value="ko-KR" data-i18n="langKo"></option>
        <option value="ja-JP" data-i18n="langJa"></option>
        <option value="bo" data-i18n="langBo"></option>
        <option value="en-US" data-i18n="langEn"></option>
      </select>
    </label>
    <label><span><span data-i18n="fOrig"></span> <small data-i18n="fOrigHint"></small></span>
      <textarea name="orig" rows="6" required></textarea>
    </label>
    <label><span><span data-i18n="fEn"></span> <small data-i18n="fTransHint"></small></span>
      <textarea name="en" rows="5"></textarea>
    </label>
    <label><span><span data-i18n="fKo"></span> <small data-i18n="fTransHint"></small></span>
      <textarea name="ko" rows="5"></textarea>
    </label>
    <menu>
      <button type="button" id="cancelAdd" class="btn" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="add"></button>
    </menu>
  </form>
</dialog>

<dialog id="walletDialog">
  <div class="wdlg">
    <h2 data-i18n="walletTitle"></h2>
    <div id="walletChoices"></div>
    <menu>
      <button type="button" id="closeWallet" class="btn" data-i18n="close"></button>
    </menu>
  </div>
</dialog>

<script src="i18n.js"></script>
<script src="sutras.js"></script>
<script src="app.js"></script>
</body>
</html>
